<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio Library</title>
  <style>
    :root {
      --bg: #101218;
      --bg-raise: #171b24;
      --bg-row: #1c212c;
      --bg-row-alt: #1a1e28;
      --line: #2a3140;
      --text: #ece8e0;
      --muted: #9b958a;
      --faint: #6e6a62;
      --accent: #e0a24a;
      --accent-dim: #8a6428;
      --play: #3dd68c;
      --voice: #c989d4;
      --sfx: #6aa6ff;
      --music: #e0a24a;
      --danger: #e06b6b;
      --row-h: 52px;
      --sidebar: 320px;
      --player-h: 76px;
      --header-h: 56px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    body {
      font: 13.5px/1.4 "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
      grid-template-rows: var(--header-h) 1fr var(--player-h);
      height: 100%;
    }
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-raise);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 210px;
    }
    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.04em;
    }
    .brand span { color: var(--muted); font-size: 12px; }
    .search-wrap {
      flex: 1;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 8px;
      padding: 0 12px 0 32px;
    }
    .search-wrap svg {
      position: absolute;
      left: 10px;
      top: 9px;
      color: var(--faint);
    }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .root-path {
      max-width: 280px;
      color: var(--faint);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: rtl;
      text-align: right;
    }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg-row);
    }
    .btn:hover { border-color: var(--accent-dim); }
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.primary {
      background: var(--accent);
      color: #1a140a;
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn.primary:disabled { opacity: 0.45; }

    .sidebar-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--line);
      background: var(--bg-raise);
    }
    .sidebar-col aside { border-right: 0; flex: 1; min-height: 0; }
    aside {
      background: var(--bg-raise);
      overflow: auto;
      padding: 14px 14px 24px;
    }
    aside input[type="search"] {
      width: 100%;
      height: 32px;
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 8px;
      padding: 0 10px;
      margin-bottom: 8px;
    }
    .pack-hint { color: var(--faint); font-size: 11px; margin: 8px 0 0; }
    #tagsMore { margin-top: 8px; width: 100%; }
    .sidebar-col:has(#packEditor.docked) .pack-list { max-height: 28vh; }
    .block { margin-bottom: 18px; }
    .block h2 {
      margin: 0 0 8px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 650;
    }
    .kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .kind {
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: left;
      color: var(--muted);
    }
    .kind b { display: block; color: var(--text); font-size: 13px; }
    .kind em { font-style: normal; font-size: 11px; color: var(--faint); }
    .kind.active { border-color: var(--accent); color: var(--text); background: #2a2418; }
    .kind[data-kind="voice"].active { border-color: var(--voice); background: #26182a; }
    .kind[data-kind="sfx"].active { border-color: var(--sfx); background: #151c2a; }
    .kind[data-kind="music"].active { border-color: var(--music); background: #2a2418; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
    }
    .chip:hover { color: var(--text); }
    .chip.active { background: var(--accent); color: #1a140a; border-color: var(--accent); font-weight: 600; }
    .chip.edit-chip { padding-right: 6px; }
    .chip-x { margin-left: 4px; font-weight: 700; }

    .pack-list { display: flex; flex-direction: column; gap: 2px; max-height: 42vh; overflow: auto; }
    .pack {
      border: 0;
      background: transparent;
      text-align: left;
      padding: 6px 8px;
      border-radius: 6px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .pack:hover, .pack.active { background: var(--bg-row); color: var(--text); }
    .pack small { color: var(--faint); }

    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .list-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    .list {
      flex: 1;
      overflow: auto;
      position: relative;
    }
    .list-inner { position: relative; }
    .rows { position: relative; }
    .row {
      display: grid;
      grid-template-columns: 40px 1fr 170px 220px 40px;
      gap: 10px;
      align-items: center;
      height: var(--row-h);
      padding: 0 14px;
      border-bottom: 1px solid #222733;
      cursor: pointer;
    }
    .row:nth-child(odd) { background: var(--bg-row-alt); }
    .row:hover { background: #252b38; }
    .row.selected { background: #2d3344; }
    .row.playing { background: #1d2a24; }
    .row.playing .name { color: var(--play); }
    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--bg);
      display: grid;
      place-items: center;
      color: var(--text);
    }
    .icon-btn:hover { border-color: var(--play); color: var(--play); }
    .row.playing .icon-btn { background: var(--play); color: #102016; border-color: var(--play); }
    .name {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cell-muted {
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }
    .taglets { display: flex; gap: 4px; overflow: hidden; }
    .taglet {
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      background: #2a3140;
      color: var(--muted);
      white-space: nowrap;
    }
    .taglet.kind-music { color: var(--music); background: #2a2418; }
    .taglet.kind-voice { color: var(--voice); background: #26182a; }
    .taglet.kind-sfx { color: var(--sfx); background: #151c2a; }
    .open-btn { color: var(--muted); border-color: transparent; background: transparent; }
    .open-btn:hover { color: var(--accent); }

    .empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
    }

    footer.player {
      grid-column: 1 / -1;
      border-top: 1px solid var(--line);
      background: var(--bg-raise);
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
    }
    .now {
      min-width: 0;
    }
    .now .now-name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now .now-sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .transport { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .transport-btns { display: flex; align-items: center; gap: 8px; }
    .seek {
      width: min(520px, 100%);
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }
    .seek input { width: 100%; accent-color: var(--accent); }
    .player-right { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
    .vol { width: 90px; accent-color: var(--accent); }

    .status { color: var(--faint); font-size: 12px; }

    #packEditor {
      padding: 12px 14px 16px;
      border-top: 1px solid var(--line);
    }
    #packEditor.docked { flex: 0 0 auto; }
    #packEditor.modal {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: var(--bg-raise);
      padding: 16px;
      overflow: auto;
      border-top: 0;
    }
    #packEditor h2 { display: inline-block; }
    #editClose { float: right; }
    .editor-title { font-weight: 650; margin: 0 0 8px; }
    #packEditor label { display: block; color: var(--faint); font-size: 11px; margin: 6px 0 4px; }
    #packEditor input[type="text"],
    #packEditor select {
      width: 100%;
      height: 32px;
      border: 1px solid var(--line);
      background: var(--bg);
      border-radius: 8px;
      padding: 0 10px;
      margin-bottom: 8px;
    }
    .editor-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .editor-msg { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .editor-msg.error { color: var(--danger); }
    .unsaved { color: var(--accent); font-size: 12px; margin-top: 6px; }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0, 0, 0, 0.55);
      display: grid;
      place-items: center;
    }
    .confirm-overlay[hidden] { display: none; }
    .confirm-box {
      background: var(--bg-raise);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      max-width: 360px;
      width: calc(100% - 32px);
    }
    .confirm-box p { margin: 0 0 14px; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar-col { display: contents; }
      aside { display: none; }
      #packEditor:not(.modal) { display: none !important; }
      .row { grid-template-columns: 40px 1fr 40px; }
      .row .hide-sm { display: none; }
      footer.player { grid-template-columns: 1fr; padding: 8px 12px; height: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>Audio Library</h1>
        <span id="countLabel">starting…</span>
      </div>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input id="search" type="search" placeholder="Search name, pack, folder, tag  —  / to focus" autofocus />
      </div>
      <div class="header-actions">
        <span class="root-path" id="rootLabel" title="">No folder selected</span>
        <button class="btn ghost" id="browseBtn" title="Choose the folder to scan">Library folder…</button>
        <button class="btn ghost" id="rescanBtn" title="Rescan the folder">Rescan</button>
      </div>
    </header>

    <div class="sidebar-col">
      <aside>
        <div class="block">
          <h2>Type</h2>
          <div class="kinds" id="kinds"></div>
        </div>
        <div class="block">
          <h2>Tags</h2>
          <input id="tagSearch" type="search" placeholder="Find a tag…" />
          <div class="chips" id="tags"></div>
          <button class="btn ghost" id="tagsMore" hidden>Show all tags</button>
        </div>
        <div class="block">
          <h2>Packs</h2>
          <input id="packSearch" type="search" placeholder="Filter packs…" />
          <div class="pack-list" id="packs"></div>
          <p class="pack-hint" id="packHint">Select a pack to add tags.</p>
        </div>
      </aside>
      <div id="packEditor" class="pack-editor" hidden>
        <h2>Tags on this pack</h2>
        <button class="btn ghost" id="editClose" hidden>Close</button>
        <div class="editor-title" id="editTitleReadout"></div>
        <label class="sr-only" for="editTitle">Pack name</label>
        <input id="editTitle" type="text" maxlength="80" placeholder="Pack name" />
        <label for="editKind">Type</label>
        <select id="editKind">
          <option value="sfx">SFX</option>
          <option value="voice">Voice</option>
          <option value="music">Music</option>
        </select>
        <div class="chips" id="editTags"></div>
        <input id="editAdd" type="text" maxlength="32" placeholder="Add a tag…  (Enter)" />
        <div class="unsaved" id="editUnsaved" hidden>Not saved yet.</div>
        <div class="editor-actions">
          <button class="btn" id="editSave" disabled>Save tags</button>
          <button class="btn ghost" id="editRestore" hidden>Restore last tags</button>
        </div>
        <div class="editor-msg" id="editMsg"></div>
      </div>
    </div>

    <main>
      <div class="list-meta">
        <div id="resultLabel">Starting…</div>
        <div class="status" id="hint">Space play/pause · ↑↓ select · O open folder · / search</div>
      </div>
      <div class="list" id="list"></div>
    </main>

    <footer class="player">
      <div class="now">
        <div class="now-name" id="nowName">Nothing playing</div>
        <div class="now-sub" id="nowSub">Pick a sound to preview</div>
      </div>
      <div class="transport">
        <div class="transport-btns">
          <button class="icon-btn" id="prevBtn" title="Previous">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="icon-btn" id="playBtn" title="Play/Pause" style="width:40px;height:40px">
            <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="icon-btn" id="nextBtn" title="Next">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
        </div>
        <div class="seek">
          <span id="curTime">0:00</span>
          <input id="seek" type="range" min="0" max="0" value="0" step="0.01" />
          <span id="durTime">0:00</span>
        </div>
      </div>
      <div class="player-right">
        <input class="vol" id="vol" type="range" min="0" max="1" step="0.01" value="0.9" title="Volume" />
        <button class="btn ghost" id="editTagsBtn" hidden title="Edit tags for this pack">Edit tags</button>
        <button class="btn" id="openCurrentBtn" title="Open folder of current sound">Open folder</button>
      </div>
    </footer>
  </div>

  <div id="confirmOverlay" class="confirm-overlay" hidden>
    <div class="confirm-box">
      <p id="confirmText">Save tags first?</p>
      <div class="editor-actions">
        <button class="btn primary" id="confirmSave">Save</button>
        <button class="btn ghost" id="confirmDont">Don't save</button>
        <button class="btn ghost" id="confirmCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const ROW_H = 52;
    const HIDDEN_CHIP_TAGS = new Set(["ultimatesfx"]);
    const CHIP_TOP_N = 24;
    const KIND_LABELS = { music: "Music", voice: "Voice", sfx: "SFX" };
    const KIND_TOKENS = new Set(["music", "voice", "sfx"]);
    const TAG_NAME_RE = /^[a-z0-9_][a-z0-9+\-._]{0,31}$/;
    const state = {
      items: [],
      filtered: [],
      kind: "all",
      tags: new Set(),
      pack: null,
      query: "",
      packQuery: "",
      tagQuery: "",
      tagsExpanded: false,
      editPack: null,
      editDraft: null,
      editOrigKind: null,
      editDirty: false,
      editSaving: false,
      editError: "",
      editMessage: "",
      editHasBackup: false,
      editRestoreWouldChange: false,
      selected: -1,
      playingId: null,
      catalog: null,
      root: "",
      scanning: false,
      scanMessage: "",
      scanError: "",
    };

    const audio = new Audio();
    audio.preload = "metadata";
    audio.volume = 0.9;

    const $ = (id) => document.getElementById(id);
    const listEl = $("list");

    const fmtTime = (s) => {
      if (!Number.isFinite(s) || s < 0) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ":" + String(sec).padStart(2, "0");
    };
    const fmtBytes = (n) => n > 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + " MB" : Math.round(n / 1024) + " KB";

    const iconPlay = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const iconPause = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
    const iconFolder = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

    function haystack(it) {
      return (it._q || (it._q = [
        it.name, it.file, it.pack, it.packTitle, it.folder, it.category, it.kind, ...(it.tags || [])
      ].join(" ").toLowerCase()));
    }

    function applyFilter() {
      const q = state.query.trim().toLowerCase();
      const terms = q ? q.split(/\s+/).filter(Boolean) : [];
      const tags = [...state.tags];
      state.filtered = state.items.filter((it) => {
        if (state.kind !== "all" && it.kind !== state.kind) return false;
        if (state.pack && it.pack !== state.pack) return false;
        if (tags.length && !tags.every((t) => it.tags.includes(t))) return false;
        if (terms.length) {
          const h = haystack(it);
          if (!terms.every((t) => h.includes(t))) return false;
        }
        return true;
      });
      if (state.selected >= state.filtered.length) state.selected = state.filtered.length - 1;
      if (!state.items.length) {
        if (state.scanning) $("resultLabel").textContent = state.scanMessage || "Scanning…";
        else if (state.scanError) $("resultLabel").textContent = state.scanError;
        else if (state.root) $("resultLabel").textContent = "0 sounds";
        else $("resultLabel").textContent = "No folder selected";
      } else {
        $("resultLabel").textContent = state.filtered.length.toLocaleString() + " sounds";
      }
      renderList();
      updateEditTagsBtn();
    }

    function kindTotals(items) {
      const kinds = { all: items.length, music: 0, voice: 0, sfx: 0 };
      for (const it of items) kinds[it.kind] = (kinds[it.kind] || 0) + 1;
      return kinds;
    }

    function chipItems(items, kind, pack) {
      return items.filter((it) =>
        (kind === "all" || it.kind === kind) &&
        (!pack || it.pack === pack)
      );
    }

    function packItems(items, kind, selectedTags) {
      return items.filter((it) => {
        if (kind !== "all" && it.kind !== kind) return false;
        if (selectedTags.length && !selectedTags.every((t) => it.tags.includes(t))) return false;
        return true;
      });
    }

    function visibleChips(tagCounts, selected, tagQuery, tagsExpanded) {
      const selectedList = [...selected];
      const q = tagQuery.trim().toLowerCase();
      const nameMatch = (t) => !q || t.toLowerCase().includes(q);

      const unselected = Object.keys(tagCounts)
        .filter((t) => !selected.has(t))
        .filter((t) => q ? nameMatch(t) : !HIDDEN_CHIP_TAGS.has(t))
        .sort((a, b) => tagCounts[b] - tagCounts[a] || a.localeCompare(b));

      if (tagsExpanded || q) {
        return { chips: selectedList.concat(unselected), unselected, truncated: false, remainder: 0 };
      }
      const room = Math.max(0, CHIP_TOP_N - selectedList.length);
      return {
        chips: selectedList.concat(unselected.slice(0, room)),
        unselected,
        truncated: unselected.length > room,
        remainder: Math.max(0, unselected.length - room),
      };
    }

    function renderSidebar() {
      const kindsC = kindTotals(state.items);
      const kinds = [
        ["all", "All", kindsC.all],
        ["music", "Music", kindsC.music],
        ["voice", "Voice", kindsC.voice],
        ["sfx", "SFX", kindsC.sfx],
      ];
      $("kinds").innerHTML = kinds.map(([id, label, n]) =>
        `<button class="kind ${state.kind === id ? "active" : ""}" data-kind="${id}"><b>${label}</b><em>${n.toLocaleString()}</em></button>`
      ).join("");

      const chipIts = chipItems(state.items, state.kind, state.pack);
      const tagCounts = {};
      for (const it of chipIts) {
        for (const t of it.tags) {
          if (KIND_TOKENS.has(t)) continue;
          tagCounts[t] = (tagCounts[t] || 0) + 1;
        }
      }
      const vis = visibleChips(tagCounts, state.tags, state.tagQuery, state.tagsExpanded);
      $("tags").innerHTML = vis.chips.map((t) => {
        const n = tagCounts[t] || 0;
        return `<button class="chip ${state.tags.has(t) ? "active" : ""}" data-tag="${escapeAttr(t)}">${escapeHtml(t)} <span style="opacity:.7">${n}</span></button>`;
      }).join("");
      const more = $("tagsMore");
      if (vis.truncated) {
        more.hidden = false;
        more.textContent = "Show all " + vis.unselected.length + " tags";
      } else if (state.tagsExpanded && !state.tagQuery.trim()) {
        more.hidden = false;
        more.textContent = "Show fewer tags";
      } else {
        more.hidden = true;
      }

      const packIts = packItems(state.items, state.kind, [...state.tags]);
      const packs = {};
      for (const it of packIts) {
        packs[it.pack] = packs[it.pack] || { title: it.packTitle, n: 0 };
        packs[it.pack].n++;
      }
      const allPacks = {};
      for (const it of state.items) {
        allPacks[it.pack] = allPacks[it.pack] || { title: it.packTitle, n: 0 };
        allPacks[it.pack].n++;
      }
      const pq = state.packQuery.trim().toLowerCase();
      let packEntries = Object.entries(packs).sort((a, b) => a[1].title.localeCompare(b[1].title));
      if (pq) {
        packEntries = packEntries.filter(([id, p]) =>
          id.toLowerCase().includes(pq) || p.title.toLowerCase().includes(pq)
        );
      }
      if (state.pack && !packEntries.some(([id]) => id === state.pack)) {
        const pinned = packs[state.pack] || allPacks[state.pack];
        if (pinned) packEntries.unshift([state.pack, pinned]);
      }
      $("packs").innerHTML = `<button class="pack ${!state.pack ? "active" : ""}" data-pack=""><span>All packs</span><small>${packIts.length}</small></button>` +
        packEntries.map(([id, p]) =>
          `<button class="pack ${state.pack === id ? "active" : ""}" data-pack="${escapeAttr(id)}"><span>${escapeHtml(p.title)}</span><small>${p.n}</small></button>`
        ).join("");
    }

    function rowHtml(it, idx, isSelected) {
      const playing = state.playingId === it.id && !audio.paused;
      const extras = (it.tags || []).filter((t) => t !== it.kind);
      const primary = extras.filter((t) => t !== "ultimatesfx");
      const skipped = extras.filter((t) => t === "ultimatesfx");
      const extraTags = primary.slice(0, 3);
      if (extraTags.length < 3) extraTags.push(...skipped.slice(0, 3 - extraTags.length));
      const cls = ["row", isSelected ? "selected" : "", playing ? "playing" : ""].filter(Boolean).join(" ");
      return `<div class="${cls}" data-idx="${idx}" data-id="${it.id}" style="height:${ROW_H}px">
        <button class="icon-btn play-row" data-id="${it.id}" title="Play">${playing ? iconPause : iconPlay}</button>
        <div>
          <div class="name" title="${escapeAttr(it.name)}">${escapeHtml(it.name)}</div>
          <div class="sub">${escapeHtml(it.packTitle)}${it.folder ? " · " + escapeHtml(it.folder) : ""}</div>
        </div>
        <div class="cell-muted hide-sm" title="${escapeAttr(it.category)}">${escapeHtml(it.category)}</div>
        <div class="taglets hide-sm">
          <span class="taglet kind-${it.kind}">${it.kind}</span>
          ${extraTags.map((t) => `<span class="taglet">${escapeHtml(t)}</span>`).join("")}
        </div>
        <button class="icon-btn open-btn" data-open="${it.id}" title="Open folder">${iconFolder}</button>
      </div>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    function renderList() {
      const items = state.filtered;
      if (!items.length) {
        if (!state.items.length) {
          const msg = state.scanError
            || (state.scanning ? (state.scanMessage || "Scanning folder and subfolders…")
            : (state.root
              ? "No audio files found in this folder."
              : "Choose a library folder to scan. Subfolders will be included."));
          listEl.innerHTML = `<div class="empty">${escapeHtml(msg)}</div>`;
        } else {
          listEl.innerHTML = `<div class="empty">No sounds match this filter.</div>`;
        }
        return;
      }
      const viewH = listEl.clientHeight || 600;
      const scroll = listEl.scrollTop;
      const start = Math.max(0, Math.floor(scroll / ROW_H) - 8);
      const vis = Math.ceil(viewH / ROW_H) + 16;
      const end = Math.min(items.length, start + vis);
      const top = start * ROW_H;
      const bottom = (items.length - end) * ROW_H;
      let html = `<div class="list-inner" style="height:${items.length * ROW_H}px">`;
      html += `<div style="height:${top}px"></div><div class="rows">`;
      for (let i = start; i < end; i++) {
        html += rowHtml(items[i], i, i === state.selected);
      }
      html += `</div><div style="height:${bottom}px"></div></div>`;
      const keep = listEl.scrollTop;
      listEl.innerHTML = html;
      listEl.scrollTop = keep;
      updateEditTagsBtn();
    }

    function currentItem() {
      return state.filtered[state.selected] || null;
    }

    function playItem(it, idx) {
      if (!it) return;
      if (typeof idx === "number") state.selected = idx;
      else state.selected = state.filtered.findIndex((x) => x.id === it.id);
      if (state.playingId === it.id && !audio.paused) {
        audio.pause();
        updatePlayUi();
        renderList();
        return;
      }
      if (state.playingId === it.id && audio.paused && audio.src) {
        audio.play();
        updatePlayUi();
        renderList();
        return;
      }
      state.playingId = it.id;
      audio.src = "/media/" + it.id;
      audio.play().catch(() => {});
      $("nowName").textContent = it.name;
      $("nowSub").textContent = it.packTitle + (it.folder ? " · " + it.folder : "");
      updatePlayUi();
      renderList();
      ensureSelectedVisible();
    }

    function updatePlayUi() {
      const playing = !audio.paused && !!audio.src;
      $("playIcon").innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    }

    function ensureSelectedVisible() {
      if (state.selected < 0) return;
      const top = state.selected * ROW_H;
      const bottom = top + ROW_H;
      const viewTop = listEl.scrollTop;
      const viewBot = viewTop + listEl.clientHeight;
      if (top < viewTop) listEl.scrollTop = top;
      else if (bottom > viewBot) listEl.scrollTop = bottom - listEl.clientHeight;
    }

    function isNarrow() {
      return window.matchMedia("(max-width: 900px)").matches;
    }

    function extrasFromTags(tags, kind) {
      return (tags || []).filter((t) => !KIND_TOKENS.has(t) && t !== kind);
    }

    function updateEditTagsBtn() {
      const btn = $("editTagsBtn");
      if (!btn) return;
      const it = state.items.find((x) => x.id === state.playingId) || currentItem();
      btn.hidden = !it;
    }

    function syncEditorUi() {
      const el = $("packEditor");
      const draft = state.editDraft;
      const dirty = state.editDirty;
      $("editSave").disabled = !dirty || state.editSaving || !draft;
      $("editSave").textContent = state.editSaving ? "Saving tags…" : (dirty ? "Save tags" : "Saved");
      $("editSave").classList.toggle("primary", dirty && !state.editSaving);
      $("editUnsaved").hidden = !dirty || state.editSaving;
      $("editRestore").hidden = !state.editRestoreWouldChange;
      $("editClose").hidden = !el.classList.contains("modal");
      if (draft) {
        if ($("editTitle") !== document.activeElement) $("editTitle").value = draft.title || "";
        if ($("editKind") !== document.activeElement) $("editKind").value = draft.kind;
        $("editTitleReadout").textContent = draft.title || state.editPack || "";
        $("editTags").innerHTML = draft.tags.map((t) =>
          `<button type="button" class="chip edit-chip" data-edit-tag="${escapeAttr(t)}">${escapeHtml(t)} <span class="chip-x" aria-label="Remove">×</span></button>`
        ).join("");
      }
      const msg = $("editMsg");
      if (state.editError) {
        msg.textContent = state.editError;
        msg.classList.add("error");
      } else {
        msg.textContent = state.editMessage || "";
        msg.classList.remove("error");
      }
    }

    function closeEditorDom() {
      const el = $("packEditor");
      el.setAttribute("hidden", "");
      el.classList.remove("modal", "docked");
      $("editClose").hidden = true;
    }

    function openEditorDom(modal) {
      const el = $("packEditor");
      el.removeAttribute("hidden");
      if (modal) {
        el.classList.add("modal");
        el.classList.remove("docked");
        $("editClose").hidden = false;
      } else {
        el.classList.add("docked");
        el.classList.remove("modal");
        $("editClose").hidden = true;
      }
    }

    function askDirty(packTitle) {
      return new Promise((resolve) => {
        const overlay = $("confirmOverlay");
        $("confirmText").textContent = "Save tags for " + packTitle + " first?";
        overlay.removeAttribute("hidden");
        const finish = (v) => {
          overlay.setAttribute("hidden", "");
          $("confirmSave").onclick = null;
          $("confirmDont").onclick = null;
          $("confirmCancel").onclick = null;
          resolve(v);
        };
        $("confirmSave").onclick = () => finish("save");
        $("confirmDont").onclick = () => finish("discard");
        $("confirmCancel").onclick = () => finish("cancel");
      });
    }

    async function confirmLeaveEditor() {
      if (!state.editDirty) return true;
      const title = (state.editDraft && state.editDraft.title) || state.editPack || "this pack";
      const choice = await askDirty(title);
      if (choice === "cancel") return false;
      if (choice === "save") return await saveEditor();
      state.editDirty = false;
      return true;
    }

    async function loadEditor(slug) {
      state.editPack = slug;
      state.editError = "";
      state.editMessage = "";
      try {
        const res = await fetch("/api/packkind?pack=" + encodeURIComponent(slug));
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.ok) {
          state.editError = body.error || "Could not read tags file.";
          state.editDraft = { kind: "sfx", title: slug, tags: [] };
          state.editOrigKind = "sfx";
          state.editDirty = false;
          state.editRestoreWouldChange = false;
          syncEditorUi();
          return;
        }
        const kind = body.kind || "sfx";
        state.editDraft = {
          kind,
          title: body.title || "",
          tags: extrasFromTags(body.tags || [], kind),
        };
        state.editOrigKind = kind;
        state.editDirty = false;
        state.editRestoreWouldChange = !!body.restoreWouldChange;
        state.editHasBackup = !!body.hasBackup;
        state.editDraft._origTags = state.editDraft.tags.slice();
        if (body.catalogAheadOfSidecar) {
          state.editMessage = "These tags look different from the last save. Restore last tags?";
        } else {
          state.editMessage = "";
        }
        syncEditorUi();
      } catch (err) {
        state.editError = "Could not read tags file.";
        syncEditorUi();
      }
    }

    async function openEditor(slug, modal) {
      openEditorDom(modal);
      await loadEditor(slug);
      if (modal) {
        const add = $("editAdd");
        if (add) add.focus();
      }
    }

    function markDirty() {
      state.editDirty = true;
      state.editError = "";
      syncEditorUi();
    }

    function addDraftTag(raw) {
      if (!state.editDraft) return;
      const t = String(raw || "").trim().toLowerCase();
      if (!t) return;
      if (/\s/.test(t)) {
        state.editError = "Use a hyphen, like sci-fi";
        syncEditorUi();
        return;
      }
      if (t === "music" || t === "voice" || t === "sfx") {
        state.editError = "Use the Type dropdown for music, voice, or sfx.";
        syncEditorUi();
        return;
      }
      if (!TAG_NAME_RE.test(t)) {
        state.editError = "That tag name isn’t allowed.";
        syncEditorUi();
        return;
      }
      if (state.editDraft.tags.includes(t)) return;
      if (state.editDraft.tags.length >= 24) {
        state.editError = "That’s enough tags for this pack.";
        syncEditorUi();
        return;
      }
      state.editDraft.tags.push(t);
      markDirty();
    }

    function applyPatchedItems(items, removedExtras) {
      const byId = new Map();
      for (const it of state.items) byId.set(it.id, it);
      for (const patch of items || []) {
        const it = byId.get(patch.id);
        if (!it) continue;
        it.kind = patch.kind;
        it.packTitle = patch.packTitle;
        it.tags = patch.tags;
        delete it._q;
      }
      renderSidebar();
      applyFilter();
      let extra = "";
      if (removedExtras && removedExtras.length && items && items.length) {
        const stayed = removedExtras.filter((t) => items.every((p) => (p.tags || []).includes(t)));
        if (stayed.length) extra = " Some tags stay because they are in the file names.";
      }
      return extra;
    }

    async function saveEditor() {
      if (!state.editDraft || !state.editPack || state.editSaving) return false;
      if (state.editDraft.kind !== state.editOrigKind) {
        const from = KIND_LABELS[state.editOrigKind] || state.editOrigKind;
        const to = KIND_LABELS[state.editDraft.kind] || state.editDraft.kind;
        const title = state.editDraft.title || state.editPack;
        if (!window.confirm("This will move " + title + " from " + from + " to " + to + ". The Music / Voice / SFX buttons will show it under " + to + ". Save anyway?")) {
          return false;
        }
      }
      const origExtras = state.editDraft._origTags || [];
      const removed = origExtras.filter((t) => !state.editDraft.tags.includes(t));
      state.editSaving = true;
      state.editError = "";
      state.editMessage = "Saving tags…";
      syncEditorUi();
      try {
        const res = await fetch("/api/packkind", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            pack: state.editPack,
            kind: state.editDraft.kind,
            title: state.editDraft.title,
            tags: state.editDraft.tags,
          }),
        });
        const body = await res.json().catch(() => ({}));
        state.editSaving = false;
        if (!res.ok || !body.ok) {
          state.editError = body.error || (res.status === 409
            ? "Scan in progress — wait, then Save."
            : "Could not save — is the share still connected?");
          if (body.sidecarSaved) {
            state.editError += " Tags are on disk. Restore first if Unreal clobbered, then Rescan.";
          }
          state.editMessage = "";
          syncEditorUi();
          return false;
        }
        const stay = applyPatchedItems(body.items || [], removed);
        state.editDirty = false;
        state.editOrigKind = state.editDraft.kind;
        state.editDraft._origTags = state.editDraft.tags.slice();
        state.editRestoreWouldChange = !!body.restoreWouldChange;
        state.editHasBackup = !!body.hasBackup;
        state.editMessage = (body.message || "Saved.") + stay;
        syncEditorUi();
        return true;
      } catch (err) {
        state.editSaving = false;
        state.editError = "Could not save — is the share still connected?";
        state.editMessage = "";
        syncEditorUi();
        return false;
      }
    }

    async function restoreEditor() {
      if (!state.editPack || state.editSaving) return;
      if (state.editDirty) {
        const title = (state.editDraft && state.editDraft.title) || state.editPack || "this pack";
        const choice = await askDirty(title);
        if (choice === "cancel") return;
        if (choice === "save") {
          if (!(await saveEditor())) return;
          return;
        }
        state.editDirty = false;
      }
      state.editSaving = true;
      state.editError = "";
      syncEditorUi();
      try {
        const res = await fetch("/api/packkind/restore", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pack: state.editPack }),
        });
        const body = await res.json().catch(() => ({}));
        state.editSaving = false;
        if (!res.ok || !body.ok) {
          state.editError = body.error || "Could not restore tags.";
          syncEditorUi();
          return;
        }
        applyPatchedItems(body.items || [], []);
        await loadEditor(state.editPack);
        state.editMessage = body.message || "Restored the last saved tags.";
        state.editDirty = false;
        syncEditorUi();
      } catch (err) {
        state.editSaving = false;
        state.editError = "Could not save — is the share still connected?";
        syncEditorUi();
      }
    }

    async function selectPack(slug) {
      if (state.editDirty && state.editPack !== slug) {
        if (!(await confirmLeaveEditor())) return;
      }
      state.pack = slug || null;
      const el = $("packEditor");
      if (!slug) {
        state.editPack = null;
        state.editDraft = null;
        state.editDirty = false;
        closeEditorDom();
      } else if (!(state.editPack === slug && state.editDraft && !el.hasAttribute("hidden"))) {
        await openEditor(slug, isNarrow());
      }
      renderSidebar();
      applyFilter();
    }

    async function openFolder(id) {
      await fetch("/api/open", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      });
    }

    function applyStatus(st) {
      state.scanning = !!st.running;
      state.scanMessage = st.message || "";
      state.scanError = st.error || "";
      state.root = st.root || state.root || "";
      $("rootLabel").textContent = state.root || "No folder selected";
      $("rootLabel").title = state.root || "";
      $("browseBtn").disabled = state.scanning;
      $("rescanBtn").disabled = state.scanning || !state.root;
      if (state.scanning) {
        $("countLabel").textContent = st.message || "scanning…";
      } else if (st.error) {
        $("countLabel").textContent = "scan failed";
      } else if (state.items.length || st.count) {
        $("countLabel").textContent = (st.count || state.items.length).toLocaleString() + " files";
      } else if (state.root) {
        $("countLabel").textContent = "0 files";
      } else {
        $("countLabel").textContent = "no folder";
      }
    }

    async function refreshStatus() {
      const res = await fetch("/api/status");
      if (!res.ok) throw new Error("status HTTP " + res.status);
      const st = await res.json();
      applyStatus(st);
      return st;
    }

    async function loadCatalog() {
      const res = await fetch("/api/catalog");
      if (!res.ok) throw new Error("catalog HTTP " + res.status);
      const data = await res.json();
      state.catalog = data;
      state.items = data.items || [];
      if (data.root && !state.root) {
        state.root = data.root;
        $("rootLabel").textContent = data.root;
        $("rootLabel").title = data.root;
      }
      renderSidebar();
      applyFilter();
      if (!state.scanning && !state.scanError) {
        $("countLabel").textContent = (data.count || state.items.length).toLocaleString() + " files";
      }
    }

    async function pollScan() {
      try {
        const st = await refreshStatus();
        if (!state.items.length) applyFilter();
        if (st.running) {
          setTimeout(pollScan, 500);
          return;
        }
        await loadCatalog();
        applyStatus(st);
        if (st.error && !state.items.length) {
          $("resultLabel").textContent = st.error;
        }
      } catch (err) {
        state.scanning = false;
        $("browseBtn").disabled = false;
        $("rescanBtn").disabled = !state.root;
        $("countLabel").textContent = "status error";
        $("resultLabel").textContent = "Failed to read scan status: " + err;
      }
    }

    $("search").addEventListener("input", (e) => {
      state.query = e.target.value;
      applyFilter();
    });
    $("kinds").addEventListener("click", (e) => {
      const btn = e.target.closest(".kind");
      if (!btn) return;
      state.kind = btn.dataset.kind;
      renderSidebar();
      applyFilter();
    });
    $("tags").addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      const t = btn.dataset.tag;
      if (state.tags.has(t)) state.tags.delete(t);
      else state.tags.add(t);
      renderSidebar();
      applyFilter();
    });
    $("packs").addEventListener("click", (e) => {
      const btn = e.target.closest(".pack");
      if (!btn) return;
      selectPack(btn.dataset.pack || null);
    });
    $("tagSearch").addEventListener("input", (e) => {
      state.tagQuery = e.target.value;
      renderSidebar();
    });
    $("packSearch").addEventListener("input", (e) => {
      state.packQuery = e.target.value;
      renderSidebar();
    });
    $("tagsMore").addEventListener("click", () => {
      state.tagsExpanded = !state.tagsExpanded;
      renderSidebar();
    });
    $("editClose").addEventListener("click", async () => {
      await selectPack(null);
    });
    $("editTitle").addEventListener("input", (e) => {
      if (!state.editDraft) return;
      state.editDraft.title = e.target.value;
      $("editTitleReadout").textContent = e.target.value || state.editPack || "";
      markDirty();
    });
    $("editKind").addEventListener("change", (e) => {
      if (!state.editDraft) return;
      state.editDraft.kind = e.target.value;
      markDirty();
    });
    $("editTags").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-edit-tag]");
      if (!btn || !state.editDraft) return;
      const t = btn.dataset.editTag;
      state.editDraft.tags = state.editDraft.tags.filter((x) => x !== t);
      markDirty();
    });
    $("editAdd").addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      addDraftTag($("editAdd").value);
      $("editAdd").value = "";
    });
    $("editSave").addEventListener("click", () => { saveEditor(); });
    $("editRestore").addEventListener("click", () => { restoreEditor(); });
    $("editTagsBtn").addEventListener("click", async () => {
      const it = state.items.find((x) => x.id === state.playingId) || currentItem();
      if (!it) return;
      if (state.editDirty && state.editPack && state.editPack !== it.pack) {
        if (!(await confirmLeaveEditor())) return;
      }
      state.pack = it.pack;
      renderSidebar();
      applyFilter();
      const el = $("packEditor");
      if (state.editPack === it.pack && state.editDraft && !el.hasAttribute("hidden")) {
        openEditorDom(true);
        syncEditorUi();
        $("editAdd").focus();
        return;
      }
      await openEditor(it.pack, true);
    });
    listEl.addEventListener("scroll", () => renderList(), { passive: true });
    listEl.addEventListener("click", (e) => {
      const open = e.target.closest("[data-open]");
      if (open) {
        e.stopPropagation();
        openFolder(Number(open.dataset.open));
        return;
      }
      const play = e.target.closest(".play-row");
      const row = e.target.closest(".row");
      if (!row) return;
      const idx = Number(row.dataset.idx);
      const it = state.filtered[idx];
      state.selected = idx;
      if (play || e.detail === 2) playItem(it, idx);
      else renderList();
    });
    listEl.addEventListener("dblclick", (e) => {
      const row = e.target.closest(".row");
      if (!row) return;
      const idx = Number(row.dataset.idx);
      playItem(state.filtered[idx], idx);
    });

    $("playBtn").addEventListener("click", () => {
      if (!audio.src) {
        const it = currentItem() || state.filtered[0];
        if (it) playItem(it);
        return;
      }
      if (audio.paused) audio.play();
      else audio.pause();
    });
    $("prevBtn").addEventListener("click", () => step(-1));
    $("nextBtn").addEventListener("click", () => step(1));
    $("openCurrentBtn").addEventListener("click", () => {
      const it = state.items.find((x) => x.id === state.playingId) || currentItem();
      if (it) openFolder(it.id);
    });
    $("vol").addEventListener("input", (e) => { audio.volume = Number(e.target.value); });
    $("seek").addEventListener("input", (e) => {
      if (Number.isFinite(audio.duration)) audio.currentTime = Number(e.target.value);
    });
    $("browseBtn").addEventListener("click", async () => {
      try {
        $("countLabel").textContent = "choose a folder…";
        const res = await fetch("/api/browse-root", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        const body = await res.json().catch(() => ({}));
        if (body.cancelled) {
          await refreshStatus().catch(() => {});
          if (!state.scanning && state.items.length) {
            $("countLabel").textContent = state.items.length.toLocaleString() + " files";
          }
          return;
        }
        if (!res.ok || !body.ok) {
          $("countLabel").textContent = "folder failed";
          $("resultLabel").textContent = body.error || "Could not choose folder";
          return;
        }
        if (body.root) {
          state.root = body.root;
          $("rootLabel").textContent = body.root;
          $("rootLabel").title = body.root;
        }
        pollScan();
      } catch (err) {
        $("countLabel").textContent = "folder failed";
        $("resultLabel").textContent = String(err);
      }
    });
    $("rescanBtn").addEventListener("click", async () => {
      try {
        $("countLabel").textContent = "rescanning…";
        const res = await fetch("/api/rescan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          $("countLabel").textContent = "rescan failed";
          $("resultLabel").textContent = body.error || "Could not start rescan";
          return;
        }
        pollScan();
      } catch (err) {
        $("countLabel").textContent = "rescan failed";
        $("resultLabel").textContent = String(err);
      }
    });

    function step(dir) {
      if (!state.filtered.length) return;
      let idx = state.selected;
      if (state.playingId != null) {
        const p = state.filtered.findIndex((x) => x.id === state.playingId);
        if (p >= 0) idx = p;
      }
      idx = Math.min(state.filtered.length - 1, Math.max(0, (idx < 0 ? 0 : idx) + dir));
      playItem(state.filtered[idx], idx);
    }

    audio.addEventListener("play", () => { updatePlayUi(); renderList(); });
    audio.addEventListener("pause", () => { updatePlayUi(); renderList(); });
    audio.addEventListener("ended", () => step(1));
    audio.addEventListener("timeupdate", () => {
      $("curTime").textContent = fmtTime(audio.currentTime);
      if (Number.isFinite(audio.duration)) {
        $("durTime").textContent = fmtTime(audio.duration);
        $("seek").max = audio.duration;
        $("seek").value = audio.currentTime;
      }
    });
    audio.addEventListener("loadedmetadata", () => {
      $("durTime").textContent = fmtTime(audio.duration);
      $("seek").max = audio.duration || 0;
    });

    document.addEventListener("keydown", (e) => {
      const typing = e.target.matches("input, textarea, select");
      if (e.key === "/" && !typing) {
        e.preventDefault();
        $("search").focus();
        $("search").select();
        return;
      }
      if (e.key === "Escape") {
        $("search").blur();
        return;
      }
      if (typing && e.key !== "Escape") return;
      if (e.key === " ") {
        e.preventDefault();
        $("playBtn").click();
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        state.selected = Math.min(state.filtered.length - 1, Math.max(0, state.selected) + 1);
        ensureSelectedVisible();
        renderList();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        state.selected = Math.max(0, (state.selected < 0 ? 0 : state.selected) - 1);
        ensureSelectedVisible();
        renderList();
      } else if (e.key === "Enter") {
        const it = currentItem();
        if (it) playItem(it, state.selected);
      } else if (e.key === "o" || e.key === "O") {
        const it = currentItem() || state.items.find((x) => x.id === state.playingId);
        if (it) openFolder(it.id);
      } else if (e.key === "ArrowLeft") {
        audio.currentTime = Math.max(0, audio.currentTime - 5);
      } else if (e.key === "ArrowRight") {
        audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
      }
    });

    let wasNarrow = isNarrow();
    window.addEventListener("resize", () => {
      renderList();
      const el = $("packEditor");
      const narrow = isNarrow();
      if (!el.hasAttribute("hidden")) {
        if (narrow && !wasNarrow) openEditorDom(true);
        else if (!narrow && wasNarrow) openEditorDom(false);
      }
      wasNarrow = narrow;
    });
    (async () => {
      try {
        const st = await refreshStatus();
        await loadCatalog();
        applyStatus(st);
        if (st.running) pollScan();
      } catch (err) {
        $("countLabel").textContent = "failed";
        $("resultLabel").textContent = "Failed to load catalog: " + err;
      }
    })();
  </script>
</body>
</html>
